{% extends 'base.html' %}{% block title %}Tickets · TicketDesk{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">TICKET QUEUE</p><h1>Support tickets</h1></div><a class="button" href="{{ url_for('tickets.create') }}">Create ticket</a></div><form class="filters" method="get"><label>Search<input name="q" value="{{ request.args.get('q','') }}" placeholder="Title or description"></label><label>Status<select name="status"><option value="">All statuses</option>{% for s in statuses %}<option value="{{ s.value }}" {% if request.args.get('status') == s.value %}selected{% endif %}>{{ s.value.replace('_',' ')|title }}</option>{% endfor %}</select></label><label>Priority<select name="priority"><option value="">All priorities</option>{% for p in priorities %}<option value="{{ p.value }}" {% if request.args.get('priority') == p.value %}selected{% endif %}>{{ p.value|title }}</option>{% endfor %}</select></label><button class="button button--secondary" type="submit">Apply</button></form>{% include 'tickets/_table.html' %}{% endblock %}
